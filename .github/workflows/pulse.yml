name: Pulse

# Daily news-pulse refresh. Replaces the old launchd job on the maintainer's
# Mac, which macOS TCC silently blocked from ~/Desktop since 2026-07-13.
# With Vercel git integration connected, the data commit auto-deploys.
on:
  schedule:
    # X is cheap enough to poll daily. LinkedIn bills per account even when it
    # has no new posts, so it rides a weekly cadence. The crons never overlap.
    # Deliberately off the hour: every scheduled run through early September
    # queued behind the 07:00 rush and actually started around 11:50 UTC, so the
    # "daily" refresh reached the site at lunchtime. Odd minutes queue shorter.
    - cron: "17 6 * * 1-6" # Mon-Sat 06:17 UTC: X only
    - cron: "17 6 * * 0" # Sunday 06:17 UTC: X and LinkedIn
  workflow_dispatch:
    inputs:
      mode:
        description: Full refresh or four-account live smoke test
        type: choice
        options: [full, smoke]
        default: full
      platforms:
        description: Social platforms to collect
        type: choice
        options: [x, "x,linkedin", linkedin]
        default: x
      dates_catchup:
        description: One-off catch-up of publish-date checks only (no social or Reddit collection, no Apify spend)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pulse-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # A choice input and env indirection keep the value out of the shell text.
      - name: Select social platforms
        id: cadence
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          CHOICE: ${{ inputs.platforms }}
        run: |
          # Match on the cron's day-of-week field, not the whole string. Matching
          # the literal "0 7 * * 0" silently dropped LinkedIn on 13 Sep 2026,
          # the first Sunday after the schedule's time was edited.
          if [ "$EVENT" = "workflow_dispatch" ]; then platforms="$CHOICE"
          elif [ "${SCHEDULE##* }" = "0" ]; then platforms="x,linkedin"
          else platforms="x"
          fi
          echo "platforms=$platforms" >> "$GITHUB_OUTPUT"
          echo "Collecting social posts from: $platforms"
      - run: node scripts/update-pulse.mjs --social-plan
        if: "!inputs.dates_catchup"
        env:
          PULSE_SOCIAL_PLATFORMS: ${{ steps.cadence.outputs.platforms }}
      - name: Live smoke test
        if: inputs.mode == 'smoke'
        run: node scripts/smoke-social.mjs
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_SECRET }}
      - name: Save smoke evidence
        if: always() && inputs.mode == 'smoke'
        uses: actions/upload-artifact@v4
        with:
          name: social-smoke-evidence
          path: |
            .smoke-social/social-coverage.json
            .smoke-social/response-shapes.json
            .smoke-social/pulse.json
          include-hidden-files: true
      - run: node scripts/update-pulse.mjs --reddit
        if: inputs.mode != 'smoke' && !inputs.dates_catchup
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_SECRET }}
          PULSE_SOCIAL_PLATFORMS: ${{ steps.cadence.outputs.platforms }}
      # Catch-up: re-checks every aggregator item with a 15-minute lookup budget and
      # writes only data/pulse.json + data/date-cache.json. Free: no Apify, no keys.
      - name: Catch up publish-date checks
        if: inputs.dates_catchup
        run: node scripts/recheck-dates.mjs --scope=all --budget=900000 --write
      - name: Commit and push if changed
        if: inputs.mode != 'smoke'
        run: |
          git config user.name "autopilot-pulse[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/pulse.json data/candidates.json data/date-cache.json data/social-state.json data/social-coverage.json
          git diff --cached --quiet && echo "pulse unchanged" && exit 0
          git commit -m "pulse: daily refresh"
          # A human pushing to main mid-run used to lose the whole collection:
          # the push was rejected and the run failed with the data already gathered.
          # These files are generated, so rebasing onto whatever landed is always safe.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected (attempt $attempt) — rebasing onto origin/main"
            git pull --rebase --autostash origin main || exit 1
          done
          echo "could not push after 3 attempts"
          exit 1
      # After the data is safely pushed: fail the run (so alert.yml opens its usual
      # issue) when the Google News resolver is broken or the dated share collapses.
      - name: Date-check health
        if: inputs.mode != 'smoke'
        run: node scripts/check-date-health.mjs
