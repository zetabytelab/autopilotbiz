name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # next build runs the TypeScript check too
      - run: npm run build
      # the Autopilot Index README generator must stay runnable from data.ts
      - run: npm run gen:index -- /tmp/generated-readme.md
